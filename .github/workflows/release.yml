name: Build release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current version after all platform checks pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-14, target: macos-arm64}
          - {runner: macos-15-intel, target: macos-x64}
          - {runner: ubuntu-22.04, target: linux-x64}
          - {runner: ubuntu-22.04-arm, target: linux-arm64}
          - {runner: windows-2022, target: windows-x64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install '.[ui,mcp]' pyinstaller==6.22.3
      - name: Install Linux inspection tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y lsof
      - name: Unix regression tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -q
      - name: Build standalone package
        run: python scripts/build-release.py --target ${{ matrix.target }}
      - name: Windows portable filesystem tests
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -p test_installation.py -q
      - name: Smoke test executable (Unix)
        if: runner.os != 'Windows'
        run: python scripts/smoke-release.py build/release/${{ matrix.target }}/binary/clean-my-agent
      - name: Smoke test executable (Windows)
        if: runner.os == 'Windows'
        run: python scripts/smoke-release.py build/release/${{ matrix.target }}/binary/clean-my-agent.exe
      - name: Windows installer check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'cma-install-check'
          $original = [Environment]::GetEnvironmentVariable('Path', 'User')
          $processPath = $env:Path
          try {
            1..2 | ForEach-Object {
              ./install.ps1 -Source "build/release/${{ matrix.target }}/binary/clean-my-agent.exe" -InstallDir $dest
            }
            clean-my-agent --version
            if ($LASTEXITCODE -ne 0) { throw 'Installed command failed.' }
            $entries = @([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -eq $dest })
            if ($entries.Count -ne 1) { throw 'User PATH must contain exactly one installation entry.' }
            ./install.ps1 -InstallDir $dest -Uninstall
            if (Test-Path (Join-Path $dest 'clean-my-agent.exe')) { throw 'Uninstall retained the executable.' }
            if ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' -contains $dest) { throw 'Uninstall retained managed PATH.' }
          } finally {
            [Environment]::SetEnvironmentVariable('Path', $original, 'User')
            $env:Path = $processPath
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/clean-my-agent-*.tar.gz
            dist/clean-my-agent-*.zip
            dist/clean-my-agent-*.sha256
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_TAG=$(python -c 'from clean_my_agent import __version__; print("v" + __version__)')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then test "$RELEASE_TAG" = "$GITHUB_REF_NAME"; fi
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            git fetch origin tag "$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          cd artifacts
          cat *.sha256 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
          for target in macos-arm64 macos-x64 linux-x64 linux-arm64; do
            test -s "clean-my-agent-$RELEASE_TAG-$target.tar.gz"
          done
          test -s "clean-my-agent-$RELEASE_TAG-windows-x64.zip"
          sha256sum --check SHA256SUMS
          cp ../install.sh ../install.ps1 .
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --latest --title "Clean My Agent $RELEASE_TAG" \
            --notes-file "../docs/releases/$RELEASE_TAG.md" --repo "$GITHUB_REPOSITORY" \
            ./*.tar.gz ./*.zip SHA256SUMS install.sh install.ps1
  verify-online-install:
    needs: publish
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install latest from the public curl entry point
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/fisecoco-byte/clean-my-agent/main/install.sh | \
            bash -s -- --bin-dir "$RUNNER_TEMP/cma-online" --no-path
          expected=$(python -c 'from clean_my_agent import __version__; print("clean-my-agent " + __version__)')
          test "$("$RUNNER_TEMP/cma-online/clean-my-agent" --version)" = "$expected"
      - name: Install latest from the public PowerShell entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP 'cma-online.ps1'
          $dest = Join-Path $env:RUNNER_TEMP 'cma-online'
          irm https://raw.githubusercontent.com/fisecoco-byte/clean-my-agent/main/install.ps1 -OutFile $script
          & $script -InstallDir $dest -NoPath
          $expected = python -c 'from clean_my_agent import __version__; print("clean-my-agent " + __version__)'
          $actual = & (Join-Path $dest 'clean-my-agent.exe') --version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) { throw 'Online installed version mismatch.' }
